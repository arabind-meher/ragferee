[project]
name = "ragferee"
version = "0.1.0"
description = "Local RAG Q&A assistant for the IFAB Laws of the Game, with cited answers"
readme = "README.md"
authors = [
    { name = "Arabind Meher", email = "arabindmeher.99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pymupdf>=2.0",
]

[project.scripts]
ragferee = "ragferee.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "FBT"]
ignore = ["D107"]  # __init__ is described by the class docstring

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test names describe the behaviour

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
untyped_calls_exclude = ["pymupdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
